name: Publicar GOKOCO manualmente no Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
      - name: Instalar dependências do build
        run: npm ci
      - name: Preparar site e Worker
        run: npm run build
        env:
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
          VITE_UTMIFY_PIXEL_ID: ${{ secrets.VITE_UTMIFY_PIXEL_ID }}
          VITE_SUPPORT_EMAIL: ${{ secrets.VITE_SUPPORT_EMAIL }}
      - name: Publicar no Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
      - name: Publicar rotina de confirmação de pagamentos
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config reconciler/wrangler.jsonc
