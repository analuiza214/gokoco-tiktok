<body>
  <header class="top"><span class="brand" aria-hidden="true">G</span> GOKOCO <span style="font-weight:500;opacity:.68;letter-spacing:0">· pedidos</span></header>
  <main class="wrap">
    <a class="back" href="/">← Voltar à loja</a>
    <section class="intro"><h1>Acompanhe seu pedido</h1><p>Veja as atualizações do seu pedido em um só lugar.</p></section>
    <section class="search-card"><form id="tracking-form"><label for="tracking-code">Código de rastreio</label><div class="search-row"><input id="tracking-code" name="codigo" maxlength="12" autocomplete="off" placeholder="Ex.: GK2A3B4C5D6E" required><button type="submit">Rastrear pedido</button></div><p class="message" id="message" aria-live="polite">O código está na mensagem de confirmação do pedido.</p></form></section>
    <div class="skeleton" id="loading" hidden></div>
    <section class="order-card" id="order" hidden></section>
    <section class="timeline-card" id="timeline" hidden></section>
    <p class="help">Precisa de ajuda? <a href="https://wa.me/5583991297085" target="_blank" rel="noopener noreferrer">Fale com nosso atendimento</a></p>
  </main>
  <script>
    (() => {
      const form=document.getElementById('tracking-form'),input=document.getElementById('tracking-code'),message=document.getElementById('message'),loading=document.getElementById('loading'),orderBox=document.getElementById('order'),timelineBox=document.getElementById('timeline');
      const labels={confirmed:'Pedido confirmado',preparing:'Em separação',shipped:'Pedido enviado',out_for_delivery:'Saiu para entrega',delivered:'Pedido entregue'};
      const details={confirmed:'Pagamento aprovado e pedido confirmado.',preparing:'Seu pedido está sendo separado e preparado.',shipped:'Seu pedido foi despachado para entrega.',out_for_delivery:'Seu pedido está a caminho do endereço informado.',delivered:'A entrega foi concluída.'};
      const escapeHtml=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const date=(value)=>new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value));
      const trackingDay=(value)=>new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(value));
      const trackingTime=(value)=>new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(new Date(value));
      const stageIcon=(status)=>{const paths={confirmed:'<path d="m5 12 4 4L19 6"/>',preparing:'<path d="m7.5 4.3 9 5.2M21 8l-9 5-9-5m9 14V12"/><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7Z"/>',packed:'<path d="m7.5 4.3 9 5.2M21 8l-9 5-9-5m9 14V12"/><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7Z"/>',shipped:'<path d="M10 17h4V5H2v12h3m12 0h2.5a1.5 1.5 0 0 0 1.5-1.5V11l-3-4h-4v10h1m-9 0a2 2 0 1 0 4 0m5 0a2 2 0 1 0 4 0"/>',in_transit:'<path d="M10 17h4V5H2v12h3m12 0h2.5a1.5 1.5 0 0 0 1.5-1.5V11l-3-4h-4v10h1m-9 0a2 2 0 1 0 4 0m5 0a2 2 0 1 0 4 0"/>',in_transit_2:'<path d="M10 17h4V5H2v12h3m12 0h2.5a1.5 1.5 0 0 0 1.5-1.5V11l-3-4h-4v10h1m-9 0a2 2 0 1 0 4 0m5 0a2 2 0 1 0 4 0"/>',out_for_delivery:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',delivered:'<path d="m5 12 4 4L19 6"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[status]||paths.preparing}</svg>`;};
      let currentData=null;
      function show(data){
        currentData=data;
        const shipping=data.shipping||{},events=Array.isArray(shipping.events)?shipping.events:[],status=shipping.status||'confirmed',stageRank={confirmed:0,preparing:1,shipped:3,out_for_delivery:5,delivered:6},currentRank=stageRank[status]??0,origin=Date.parse(shipping.created_at||data.createdAt),now=Date.now();
        orderBox.innerHTML=data.manual?`<div class="order-head"><div class="tracking-order-heading"><div class="caption">CÓDIGO DE RASTREIO</div><div class="code">${escapeHtml(data.code)}</div></div><span class="status">Acompanhamento estimado</span></div>`:`<div class="order-head"><div class="tracking-order-heading"><div class="caption">PEDIDO</div><div class="code">${escapeHtml(data.code)}</div><div class="tracking-customer">${escapeHtml(data.buyerName||'Cliente')}</div></div><span class="status status-${escapeHtml(status)}">${escapeHtml(labels[status]||'Pedido em atualização')}</span></div><div class="order-products"><div class="products">${(data.products?.length?data.products:[{name:'Escova Modeladora GOKOCO',quantity:1,image:null}]).map(p=>`<div class="product">${p.image?`<img class="product-image" src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" loading="lazy">`:'<span class="product-icon">📦</span>'}<span>${escapeHtml(p.name)}<small>Quantidade: ${Number(p.quantity)||1}</small></span></div>`).join('')}</div>${data.destination?.city?`<div class="destination">Destino: <strong>${escapeHtml(data.destination.city)}${data.destination.state?', '+escapeHtml(data.destination.state):''}</strong></div>`:''}</div>`;
        const actual=[{status:'confirmed',at:shipping.created_at||data.createdAt,label:data.manual?'Código gerado':labels.confirmed,detail:data.manual?'Acompanhamento iniciado. As próximas etapas são estimativas.':details.confirmed},...events].filter((event,index,list)=>list.findIndex(item=>item.status===event.status)===index).sort((a,b)=>Date.parse(a.at)-Date.parse(b.at)).map(event=>({...event,kind:'actual'}));
        const actualStatuses=new Set(actual.map(event=>event.status));
        const HUBS={SP:'São Paulo, SP',RJ:'Rio de Janeiro, RJ',ES:'Vitória, ES',MG:'Belo Horizonte, MG',RS:'Porto Alegre, RS',SC:'Florianópolis, SC',PR:'Curitiba, PR',GO:'Goiânia, GO',DF:'Brasília, DF',MT:'Cuiabá, MT',MS:'Campo Grande, MS',TO:'Palmas, TO',BA:'Salvador, BA',SE:'Aracaju, SE',PE:'Recife, PE',PB:'João Pessoa, PB',AL:'Maceió, AL',RN:'Natal, RN',CE:'Fortaleza, CE',PI:'Teresina, PI',MA:'São Luís, MA',PA:'Belém, PA',AP:'Macapá, AP',AM:'Manaus, AM',RR:'Boa Vista, RR',AC:'Rio Branco, AC',RO:'Porto Velho, RO'};
        const ORIGIN_CITY='Guarulhos, SP',uf=String(data.destination?.state||'').toUpperCase(),hub=HUBS[uf]||'São Paulo, SP',clientCity=data.destination?.city?`${data.destination.city}${uf?', '+uf:''}`:'';
        const H=(h,m)=>(h*60+m)*60000;
        const planned=[
          {status:'preparing',rank:1,offset:H(0,18),label:'Previsão: Em separação',detail:data.manual?'Etapa prevista de separação.':`Separação estimada no estoque — ${ORIGIN_CITY}.`},
          {status:'packed',rank:2,offset:H(0,47),label:'Previsão: Em embalagem',detail:data.manual?'Etapa prevista de embalagem.':'Embalagem estimada do pedido.'},
          {status:'shipped',rank:3,offset:H(1,34),label:'Previsão: Coletado pela transportadora',detail:data.manual?'Etapa prevista de coleta.':`Coleta estimada saindo de ${ORIGIN_CITY}.`},
          {status:'in_transit',rank:4,offset:H(4,13),label:'Previsão: Em trânsito',detail:data.manual?'Etapa prevista de transporte.':hub!=='São Paulo, SP'?`Rota estimada — ${ORIGIN_CITY} → ${hub}.`:'Rota estimada pelo centro de triagem nacional.'},
          {status:'in_transit_2',rank:4.5,offset:H(24,39),label:'Previsão: Em trânsito para a unidade de destino',detail:data.manual?'Etapa prevista até a unidade de distribuição.':clientCity?`Rota estimada — ${hub} → ${clientCity}.`:`Rota estimada para a unidade de distribuição de destino.`},
          {status:'out_for_delivery',rank:5,offset:H(48,22),label:'Previsão: Saiu para entrega',detail:data.manual?'Etapa prevista de saída para entrega.':clientCity?`Previsão de saída para entrega em ${clientCity}.`:'Saída para entrega estimada no endereço informado.'},
          {status:'delivered',rank:6,offset:H(360,0),label:'Previsão: Entrega estimada',detail:data.manual?'Estimativa de conclusão; não confirma entrega.':'Entrega prevista; pode variar.'},
        ].filter(item=>item.rank>currentRank&&!actualStatuses.has(item.status)).map(item=>({...item,at:new Date(origin+item.offset).toISOString(),kind:'forecast'})).filter(item=>!['out_for_delivery','delivered'].includes(item.status)||Date.parse(item.at)<=now);
        const timeline=[...actual,...planned].sort((a,b)=>Date.parse(a.at)-Date.parse(b.at));
        timelineBox.innerHTML=`<div class="tracking-stages">${timeline.map((event,index)=>{const done=event.kind==='actual'&&event.status!==status,active=event.kind==='actual'&&event.status===status,simulated=event.kind==='forecast'&&Date.parse(event.at)<=now,reachedNext=timeline[index+1]?.kind==='forecast'&&Date.parse(timeline[index+1].at)<=now,label=(event.label||labels[event.status]||'Atualização do pedido').replace(/^Previsão:\s*/,'');return `<div class="tracking-stage ${done?'done':''} ${active?'active':''} ${event.kind==='forecast'?'forecast':''} ${simulated?'simulated':''} ${reachedNext?'reached-next':''}"><span class="stage-icon">${stageIcon(event.status)}</span><div class="stage-copy"><div class="stage-title"><strong>${escapeHtml(label)}</strong>${event.kind==='forecast'?`<span class="stage-badge">${simulated?'Previsão':'Previsão'}</span>`:''}</div><p>${escapeHtml(event.detail||details[event.status]||'')}</p><time>${escapeHtml(trackingDay(event.at||data.createdAt))} — ${escapeHtml(trackingTime(event.at||data.createdAt))}</time></div></div>`}).join('')}</div>`;
        orderBox.hidden=false;timelineBox.hidden=false;
      }      async function search(code,updateUrl){if(!code)return;input.value=code.toUpperCase();message.textContent='Buscando seu pedido…';message.className='message';loading.hidden=false;orderBox.hidden=true;timelineBox.hidden=true;form.querySelector('button').disabled=true;try{const response=await fetch('/api/public/order-tracking?code='+encodeURIComponent(code.toUpperCase()),{headers:{Accept:'application/json'},cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Não encontramos esse código. Confira e tente novamente.');show(data);message.textContent='Estas são as atualizações disponíveis para o seu pedido.';if(updateUrl)history.replaceState(null,'','/rastreio.html?codigo='+encodeURIComponent(data.code));}catch(error){message.textContent=error.message||'Não foi possível buscar o pedido. Tente novamente.';message.className='message error';}finally{loading.hidden=true;form.querySelector('button').disabled=false;}}
      form.addEventListener('submit',event=>{event.preventDefault();search(input.value.trim(),true);});const code=new URLSearchParams(location.search).get('codigo')||'';if(code)search(code,false);
      setInterval(()=>{if(currentData&&!timelineBox.hidden)show(currentData);},10000);
    })();
  </script>
</body>
