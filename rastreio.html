<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Rastrear pedido · GOKOCO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#0f172a;background:#f8fafc;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}a{color:inherit}.top{display:none;height:60px;background:#111827;color:#fff;align-items:center;justify-content:center;gap:9px;font-weight:900;letter-spacing:.12em;font-size:15px}.brand{height:29px;width:29px;display:grid;place-items:center;border-radius:9px;background:#00b94f;color:#fff;letter-spacing:0}.wrap{max-width:768px;margin:auto;padding:40px 16px 52px}.back{display:none;text-decoration:none;color:#656565;font-size:13px;font-weight:600;margin:0 0 18px}.intro{display:none}.intro h1{font-size:25px;letter-spacing:-.04em;margin:0 0 6px;font-weight:900}.intro p{margin:0;color:#71717a;font-size:13px;line-height:1.5}.search-card,.order-card,.timeline-card{background:#fff;border:1px solid #ededed;border-radius:16px;box-shadow:0 2px 10px #00000008}.search-card{padding:24px;margin-top:0}.search-card label{display:none;color:#52525b;font-size:12px;font-weight:700;margin:0 0 8px}.search-row{display:flex;gap:12px}.search-row input{padding-left:36px;background-color:#fff;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2720%27 height=%2720%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%2394a3b8%27 stroke-width=%272%27 stroke-linecap=%27round%27%3E%3Ccircle cx=%2711%27 cy=%2711%27 r=%278%27/%3E%3Cpath d=%27m21 21-4.35-4.35%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:12px center}.search-row input{flex:1;min-width:0;border:1px solid #e4e4e7;border-radius:10px;padding:12px 13px 12px 36px;font-size:14px;outline:none}.search-row input:focus{border-color:#00a846;box-shadow:0 0 0 3px #00b94f1c}.search-row button{border:0;border-radius:14px;background:linear-gradient(110deg,#11853c,#20c96b);color:#fff;padding:0 24px;font-size:13px;font-weight:800;cursor:pointer;text-transform:uppercase}.search-row button:disabled{opacity:.6;cursor:wait}.message{display:none;min-height:19px;margin:8px 1px 0;color:#a1a1aa;font-size:11px}.message.error{color:#dc2626}.order-card{margin-top:20px;padding:22px}.buyer-greeting{margin:0 0 12px;color:#171717;font-size:15px;font-weight:800}.product-image{height:48px;width:48px;flex:none;object-fit:contain;border-radius:10px;background:#dcfce7;padding:3px}.order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.caption{color:#71717a;font-size:11px}.code{font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;margin-top:4px}.status{border-radius:99px;background:#dcfce7;color:#166534;padding:7px 10px;font-size:10px;font-weight:800;white-space:nowrap}.products{margin-top:16px;border-top:1px solid #f1f1f1;padding-top:13px}.product{display:flex;align-items:center;gap:11px;font-size:12px;font-weight:700}.product-icon{height:39px;width:39px;border-radius:11px;background:#dcfce7;display:grid;place-items:center;font-size:19px}.product small{display:block;color:#8a8a8a;font-size:10px;font-weight:500;margin-top:3px}.destination{margin-top:14px;padding:11px 12px;border-radius:10px;background:#f7f7f8;color:#71717a;font-size:11px}.destination strong{color:#3f3f46}.timeline-card{margin-top:20px;padding:24px}.timeline-title{font-size:14px;font-weight:900;margin:0}.timeline-note{margin:4px 0 16px;font-size:11px;color:#85858b}.event{position:relative;display:flex;gap:12px;min-height:75px}.event:not(:last-child):before{content:"";position:absolute;width:2px;left:17px;top:37px;bottom:0;background:#e4e4e7}.event.done:not(:last-child):before{background:#00b94f}.dot{z-index:1;flex:none;width:36px;height:36px;border:2px solid #e4e4e7;background:#fff;border-radius:50%;display:grid;place-items:center;color:#a1a1aa;font-size:12px}.event.done .dot{background:#00b94f;border-color:#00a846;color:#fff}.event.active .dot{border-color:#00a846;box-shadow:0 0 0 4px #00b94f1c;color:#00a846}.event-copy{padding:4px 0 17px}.event-copy strong{display:block;color:#b0b0b5;font-size:12px}.event.done .event-copy strong,.event.active .event-copy strong{color:#191919}.event-copy p{margin:4px 0 0;color:#85858b;font-size:10px;line-height:1.5}.event-copy time{display:block;margin-top:5px;color:#a1a1aa;font-size:10px}.event.forecast:not(:last-child):before{background:repeating-linear-gradient(to bottom,#d4d4d8 0 4px,transparent 4px 8px)}.event.forecast .dot{border-style:dashed;background:#fafafa}.event.forecast .event-copy strong{color:#737373}.event.forecast .event-copy p{color:#a1a1aa}.help{text-align:center;color:#8a8a8a;margin:18px 0 0;font-size:10px}.help a{color:#00a846;font-weight:700;text-decoration:none}.skeleton{height:110px;border-radius:13px;background:linear-gradient(100deg,#f1f1f2 30%,#fafafa 50%,#f1f1f2 70%);background-size:200% 100%;animation:shine 1.3s infinite}@keyframes shine{to{background-position:-200% 0}}[hidden]{display:none!important}@media(max-width:520px){.wrap{padding:18px 13px 38px}.intro h1{font-size:22px}.search-card{padding:14px}.search-row{flex-direction:row}.search-row button{height:44px;padding:0 15px}.order-card,.timeline-card{padding:15px}.status{font-size:9px;padding:6px 8px}}
  </style>
</head>
<body>
  <header class="top"><span class="brand" aria-hidden="true">G</span> GOKOCO <span style="font-weight:500;opacity:.68;letter-spacing:0">· pedidos</span></header>
  <main class="wrap">
    <a class="back" href="/">← Voltar à loja</a>
    <section class="intro"><h1>Acompanhe seu pedido</h1><p>Veja as atualizações do seu pedido em um só lugar.</p></section>
    <section class="search-card"><form id="tracking-form"><label for="tracking-code">Código de rastreio</label><div class="search-row"><input id="tracking-code" name="codigo" maxlength="12" autocomplete="off" placeholder="Ex.: GK2A3B4C5D6E" required><button type="submit">Rastrear pedido</button></div><p class="message" id="message" aria-live="polite">O código está na mensagem de confirmação do pedido.</p></form></section>
    <div class="skeleton" id="loading" hidden></div>
    <section class="order-card" id="order" hidden></section>
    <section class="timeline-card" id="timeline" hidden></section>
    <p class="help">Precisa de ajuda? <a href="https://wa.me/5583991297085" target="_blank" rel="noopener noreferrer">Fale com nosso atendimento</a></p>
  </main>
  <script>
    (() => {
      const form=document.getElementById('tracking-form'),input=document.getElementById('tracking-code'),message=document.getElementById('message'),loading=document.getElementById('loading'),orderBox=document.getElementById('order'),timelineBox=document.getElementById('timeline');
      const labels={confirmed:'Pedido confirmado',preparing:'Preparando pedido',shipped:'Pedido enviado',out_for_delivery:'Saiu para entrega',delivered:'Pedido entregue'};
      const details={confirmed:'Pagamento aprovado e pedido confirmado.',preparing:'Seu pedido está sendo separado e preparado.',shipped:'Seu pedido foi despachado para entrega.',out_for_delivery:'Seu pedido está a caminho do endereço informado.',delivered:'A entrega foi concluída.'};
      const escapeHtml=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const date=(value)=>new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value));
      function show(data){const shipping=data.shipping||{},events=Array.isArray(shipping.events)?shipping.events:[],status=shipping.status||'confirmed',stages=Object.keys(labels),currentIndex=stages.indexOf(status),origin=Date.parse(shipping.created_at||data.createdAt);orderBox.innerHTML=`${data.buyerName?`<div class="buyer-greeting">Olá, ${escapeHtml(data.buyerName)} 👋</div>`:''}<div class="order-head"><div><div class="caption">Código de rastreio</div><div class="code">${escapeHtml(data.code)}</div></div><span class="status">${escapeHtml(labels[status]||'Pedido em atualização')}</span></div><div class="products">${(data.products?.length?data.products:[{name:'Escova Modeladora GOKOCO',quantity:1,image:null}]).map(p=>`<div class="product">${p.image?`<img class="product-image" src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" loading="lazy">`:'<span class="product-icon">📦</span>'}<span>${escapeHtml(p.name)}<small>Quantidade: ${Number(p.quantity)||1}</small></span></div>`).join('')}</div>${data.destination?.city?`<div class="destination">Destino: <strong>${escapeHtml(data.destination.city)}${data.destination.state?', '+escapeHtml(data.destination.state):''}</strong></div>`:''}`;const actual=[{status:'confirmed',at:shipping.created_at||data.createdAt,label:labels.confirmed,detail:details.confirmed},...events].filter((event,index,list)=>list.findIndex(item=>item.status===event.status)===index).sort((a,b)=>stages.indexOf(a.status)-stages.indexOf(b.status));const actualStatuses=new Set(actual.map(event=>event.status));const planned=[{status:'preparing',hours:2.35,label:'Previsão: preparação do pedido'},{status:'shipped',hours:53.45,label:'Previsão: despacho do pedido'},{status:'out_for_delivery',hours:171.37,label:'Previsão: saída para entrega'},{status:'delivered',hours:216,label:'Previsão: entrega estimada'}].filter(item=>stages.indexOf(item.status)>currentIndex&&!actualStatuses.has(item.status)).map(item=>({...item,at:new Date(origin+item.hours*3600000).toISOString(),detail:'Data estimada; a etapa só será confirmada após atualização da loja.'}));const timeline=[...actual.map(event=>({...event,kind:'actual'})),...planned.map(event=>({...event,kind:'forecast'}))].sort((a,b)=>Date.parse(a.at)-Date.parse(b.at));timelineBox.innerHTML=`<h2 class="timeline-title">Etapas do pedido</h2><p class="timeline-note">As previsões são estimativas. O andamento real aparece quando a loja confirma uma etapa.</p>${timeline.map((event,index)=>{const done=event.kind==='actual'&&event.status!==status,active=event.kind==='actual'&&event.status===status;return `<div class="event ${done?'done':''} ${active?'active':''} ${event.kind==='forecast'?'forecast':''}"><span class="dot">${done?'✓':index+1}</span><div class="event-copy"><strong>${escapeHtml(event.label||labels[event.status]||'Atualização do pedido')}</strong><p>${escapeHtml(event.detail||details[event.status]||'')}</p><time>${event.kind==='forecast'?'Estimativa · ':''}${escapeHtml(date(event.at||data.createdAt))}</time></div></div>`}).join('')}`;orderBox.hidden=false;timelineBox.hidden=false;}
      async function search(code,updateUrl){if(!code)return;input.value=code.toUpperCase();message.textContent='Buscando seu pedido…';message.className='message';loading.hidden=false;orderBox.hidden=true;timelineBox.hidden=true;form.querySelector('button').disabled=true;try{const response=await fetch('/api/public/order-tracking?code='+encodeURIComponent(code.toUpperCase()),{headers:{Accept:'application/json'},cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Não encontramos esse código. Confira e tente novamente.');show(data);message.textContent='Estas são as atualizações disponíveis para o seu pedido.';if(updateUrl)history.replaceState(null,'','/rastreio.html?codigo='+encodeURIComponent(data.code));}catch(error){message.textContent=error.message||'Não foi possível buscar o pedido. Tente novamente.';message.className='message error';}finally{loading.hidden=true;form.querySelector('button').disabled=false;}}
      form.addEventListener('submit',event=>{event.preventDefault();search(input.value.trim(),true);});const code=new URLSearchParams(location.search).get('codigo')||'';if(code)search(code,false);
    })();
  </script>
</body>
</html>
