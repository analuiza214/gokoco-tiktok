<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Rastrear pedido · GOKOCO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#171717;background:#f6f6f6;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}a{color:inherit}.top{height:60px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:900;letter-spacing:.12em;font-size:15px}.brand{height:29px;width:29px;display:grid;place-items:center;border-radius:9px;background:#fe2c55;color:#fff;letter-spacing:0}.wrap{max-width:760px;margin:auto;padding:24px 16px 52px}.back{display:inline-flex;text-decoration:none;color:#656565;font-size:13px;font-weight:600;margin:0 0 18px}.intro h1{font-size:25px;letter-spacing:-.04em;margin:0 0 6px;font-weight:900}.intro p{margin:0;color:#71717a;font-size:13px;line-height:1.5}.search-card,.order-card,.timeline-card{background:#fff;border:1px solid #ededed;border-radius:16px;box-shadow:0 2px 10px #00000008}.search-card{padding:17px;margin-top:20px}.search-card label{display:block;color:#52525b;font-size:12px;font-weight:700;margin:0 0 8px}.search-row{display:flex;gap:9px}.search-row input{flex:1;min-width:0;border:1px solid #e4e4e7;border-radius:10px;padding:12px 13px;font-size:14px;outline:none}.search-row input:focus{border-color:#fe2c55;box-shadow:0 0 0 3px #fe2c551c}.search-row button{border:0;border-radius:10px;background:#fe2c55;color:#fff;padding:0 19px;font-size:13px;font-weight:800;cursor:pointer}.search-row button:disabled{opacity:.6;cursor:wait}.message{min-height:19px;margin:8px 1px 0;color:#a1a1aa;font-size:11px}.message.error{color:#dc2626}.order-card{margin-top:15px;padding:16px}.order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.caption{color:#71717a;font-size:11px}.code{font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;margin-top:4px}.status{border-radius:99px;background:#fff0f2;color:#e11d48;padding:7px 10px;font-size:10px;font-weight:800;white-space:nowrap}.products{margin-top:16px;border-top:1px solid #f1f1f1;padding-top:13px}.product{display:flex;align-items:center;gap:11px;font-size:12px;font-weight:700}.product-icon{height:39px;width:39px;border-radius:11px;background:#fff0f2;display:grid;place-items:center;font-size:19px}.product small{display:block;color:#8a8a8a;font-size:10px;font-weight:500;margin-top:3px}.destination{margin-top:14px;padding:11px 12px;border-radius:10px;background:#f7f7f8;color:#71717a;font-size:11px}.destination strong{color:#3f3f46}.timeline-card{margin-top:15px;padding:18px}.timeline-title{font-size:14px;font-weight:900;margin:0}.timeline-note{margin:4px 0 16px;font-size:11px;color:#85858b}.event{position:relative;display:flex;gap:12px;min-height:75px}.event:not(:last-child):before{content:"";position:absolute;width:2px;left:13px;top:29px;bottom:0;background:#e4e4e7}.event.done:not(:last-child):before{background:#fe2c55}.dot{z-index:1;flex:none;width:28px;height:28px;border:2px solid #e4e4e7;background:#fff;border-radius:50%;display:grid;place-items:center;color:#a1a1aa;font-size:12px}.event.done .dot{background:#fe2c55;border-color:#fe2c55;color:#fff}.event.active .dot{border-color:#fe2c55;box-shadow:0 0 0 4px #fe2c551c;color:#fe2c55}.event-copy{padding:4px 0 17px}.event-copy strong{display:block;color:#b0b0b5;font-size:12px}.event.done .event-copy strong,.event.active .event-copy strong{color:#191919}.event-copy p{margin:4px 0 0;color:#85858b;font-size:10px;line-height:1.5}.event-copy time{display:block;margin-top:5px;color:#a1a1aa;font-size:10px}.help{text-align:center;color:#8a8a8a;margin:18px 0 0;font-size:10px}.help a{color:#fe2c55;font-weight:700;text-decoration:none}.skeleton{height:110px;border-radius:13px;background:linear-gradient(100deg,#f1f1f2 30%,#fafafa 50%,#f1f1f2 70%);background-size:200% 100%;animation:shine 1.3s infinite}@keyframes shine{to{background-position:-200% 0}}[hidden]{display:none!important}@media(max-width:520px){.wrap{padding:18px 13px 38px}.intro h1{font-size:22px}.search-card{padding:14px}.search-row{flex-direction:column}.search-row button{height:44px}.order-card,.timeline-card{padding:15px}.status{font-size:9px;padding:6px 8px}}
  </style>
</head>
<body>
  <header class="top"><span class="brand" aria-hidden="true">G</span> GOKOCO <span style="font-weight:500;opacity:.68;letter-spacing:0">· pedidos</span></header>
  <main class="wrap">
    <a class="back" href="/">← Voltar à loja</a>
    <section class="intro"><h1>Acompanhe seu pedido</h1><p>Veja as atualizações do seu pedido em um só lugar.</p></section>
    <section class="search-card"><form id="tracking-form"><label for="tracking-code">Código de rastreio</label><div class="search-row"><input id="tracking-code" name="codigo" maxlength="12" autocomplete="off" placeholder="Ex.: GK2A3B4C5D6E" required><button type="submit">Rastrear pedido</button></div><p class="message" id="message" aria-live="polite">O código está na mensagem de confirmação do pedido.</p></form></section>
    <div class="skeleton" id="loading" hidden></div>
    <section class="order-card" id="order" hidden></section>
    <section class="timeline-card" id="timeline" hidden></section>
    <p class="help">Precisa de ajuda? <a href="https://wa.me/5583991297085" target="_blank" rel="noopener noreferrer">Fale com nosso atendimento</a></p>
  </main>
  <script>
    (() => {
      const form=document.getElementById('tracking-form'),input=document.getElementById('tracking-code'),message=document.getElementById('message'),loading=document.getElementById('loading'),orderBox=document.getElementById('order'),timelineBox=document.getElementById('timeline');
      const labels={confirmed:'Pedido confirmado',preparing:'Preparando pedido',shipped:'Pedido enviado',out_for_delivery:'Saiu para entrega',delivered:'Pedido entregue'};
      const details={confirmed:'Pagamento aprovado e pedido confirmado.',preparing:'Seu pedido está sendo separado e preparado.',shipped:'Seu pedido foi despachado para entrega.',out_for_delivery:'Seu pedido está a caminho do endereço informado.',delivered:'A entrega foi concluída.'};
      const escapeHtml=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const date=(value)=>new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value));
      function show(data){const shipping=data.shipping||{},events=Array.isArray(shipping.events)?shipping.events:[],status=shipping.status||'confirmed',stages=Object.keys(labels),currentIndex=stages.indexOf(status);orderBox.innerHTML=`<div class="order-head"><div><div class="caption">Código de rastreio</div><div class="code">${escapeHtml(data.code)}</div></div><span class="status">${escapeHtml(labels[status]||'Pedido em atualização')}</span></div><div class="products">${(data.products?.length?data.products:[{name:'Escova Modeladora GOKOCO',quantity:1}]).map(p=>`<div class="product"><span class="product-icon">📦</span><span>${escapeHtml(p.name)}<small>Quantidade: ${Number(p.quantity)||1}</small></span></div>`).join('')}</div>${data.destination?.city?`<div class="destination">Destino: <strong>${escapeHtml(data.destination.city)}${data.destination.state?', '+escapeHtml(data.destination.state):''}</strong></div>`:''}`;const completed=stages.slice(0,currentIndex).map(key=>({status:key,at:data.createdAt,label:labels[key],detail:details[key]}));const all=[...completed,...events.filter(event=>event.status===status||!completed.some(item=>item.status===event.status))];const unique=all.filter((event,index)=>all.findIndex(other=>other.status===event.status)===index);timelineBox.innerHTML=`<h2 class="timeline-title">Status do pedido</h2><p class="timeline-note">Atualizado conforme as etapas registradas pela loja.</p>${unique.map((event,index)=>{const stageIndex=stages.indexOf(event.status),done=stageIndex>=0&&stageIndex<currentIndex,active=event.status===status;return `<div class="event ${done?'done':''} ${active?'active':''}"><span class="dot">${done?'✓':index+1}</span><div class="event-copy"><strong>${escapeHtml(event.label||labels[event.status]||'Atualização do pedido')}</strong><p>${escapeHtml(event.detail||details[event.status]||'')}</p><time>${escapeHtml(date(event.at||data.createdAt))}</time></div></div>`}).join('')}`;orderBox.hidden=false;timelineBox.hidden=false;}
      async function search(code,updateUrl){if(!code)return;input.value=code.toUpperCase();message.textContent='Buscando seu pedido…';message.className='message';loading.hidden=false;orderBox.hidden=true;timelineBox.hidden=true;form.querySelector('button').disabled=true;try{const response=await fetch('/api/public/order-tracking?code='+encodeURIComponent(code.toUpperCase()),{headers:{Accept:'application/json'},cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Não encontramos esse código. Confira e tente novamente.');show(data);message.textContent='Estas são as atualizações disponíveis para o seu pedido.';if(updateUrl)history.replaceState(null,'','/rastreio.html?codigo='+encodeURIComponent(data.code));}catch(error){message.textContent=error.message||'Não foi possível buscar o pedido. Tente novamente.';message.className='message error';}finally{loading.hidden=true;form.querySelector('button').disabled=false;}}
      form.addEventListener('submit',event=>{event.preventDefault();search(input.value.trim(),true);});const code=new URLSearchParams(location.search).get('codigo')||'';if(code)search(code,false);
    })();
  </script>
</body>
</html>
