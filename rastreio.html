      feeDialog.addEventListener('click',(event)=>{if(event.target===feeDialog)feeDialog.close();});      async function search(code,updateUrl){if(!code)return;input.value=code.toUpperCase();message.textContent='Buscando seu pedido…';message.className='message';loading.hidden=false;orderBox.hidden=true;timelineBox.hidden=true;form.querySelector('button').disabled=true;try{const response=await fetch('/api/public/order-tracking?code='+encodeURIComponent(code.toUpperCase()),{headers:{Accept:'application/json'},cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Não encontramos esse código. Confira e tente novamente.');show(data);message.textContent='Estas são as atualizações disponíveis para o seu pedido.';if(updateUrl)history.replaceState(null,'','/rastreio.html?codigo='+encodeURIComponent(data.code));}catch(error){message.textContent=error.message||'Não foi possível buscar o pedido. Tente novamente.';message.className='message error';}finally{loading.hidden=true;form.querySelector('button').disabled=false;}}
      form.addEventListener('submit',event=>{event.preventDefault();search(input.value.trim(),true);});const code=new URLSearchParams(location.search).get('codigo')||'';if(code)search(code,false);
      setInterval(()=>{if(currentData&&!timelineBox.hidden)show(currentData);},10000);
    })();
