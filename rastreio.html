<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Rastrear pedido · GOKOCO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#171717;background:#f6f6f6;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}a{color:inherit}.top{height:60px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:900;letter-spacing:.12em;font-size:15px}.brand{height:29px;width:29px;display:grid;place-items:center;border-radius:9px;background:#fe2c55;color:#fff;letter-spacing:0}.wrap{max-width:760px;margin:auto;padding:24px 16px 52px}.back{display:inline-flex;text-decoration:none;color:#656565;font-size:13px;font-weight:600;margin:0 0 18px}.intro h1{font-size:25px;letter-spacing:-.04em;margin:0 0 6px;font-weight:900}.intro p{margin:0;color:#71717a;font-size:13px;line-height:1.5}.search-card,.order-card,.timeline-card{background:#fff;border:1px solid #ededed;border-radius:16px;box-shadow:0 2px 10px #00000008}.search-card{padding:17px;margin-top:20px}.search-card label{display:block;color:#52525b;font-size:12px;font-weight:700;margin:0 0 8px}.search-row{display:flex;gap:9px}.search-row input{flex:1;min-width:0;border:1px solid #e4e4e7;border-radius:10px;padding:12px 13px;font-size:14px;outline:none}.search-row input:focus{border-color:#fe2c55;box-shadow:0 0 0 3px #fe2c551c}.search-row button{border:0;border-radius:10px;background:#fe2c55;color:#fff;padding:0 19px;font-size:13px;font-weight:800;cursor:pointer}.search-row button:disabled{opacity:.6;cursor:wait}.message{min-height:19px;margin:8px 1px 0;color:#a1a1aa;font-size:11px}.message.error{color:#dc2626}.order-card{margin-top:15px;padding:16px}.buyer-greeting{margin:0 0 12px;color:#171717;font-size:15px;font-weight:800}.product-image{height:48px;width:48px;flex:none;object-fit:contain;border-radius:10px;background:#fff0f2;padding:3px}.order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.caption{color:#71717a;font-size:11px}.code{font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;margin-top:4px}.status{border-radius:99px;background:#fff0f2;color:#e11d48;padding:7px 10px;font-size:10px;font-weight:800;white-space:nowrap}.products{margin-top:16px;border-top:1px solid #f1f1f1;padding-top:13px}.product{display:flex;align-items:center;gap:11px;font-size:12px;font-weight:700}.product-icon{height:39px;width:39px;border-radius:11px;background:#fff0f2;display:grid;place-items:center;font-size:19px}.product small{display:block;color:#8a8a8a;font-size:10px;font-weight:500;margin-top:3px}.destination{margin-top:14px;padding:11px 12px;border-radius:10px;background:#f7f7f8;color:#71717a;font-size:11px}.destination strong{color:#3f3f46}.timeline-card{margin-top:15px;padding:18px}.timeline-title{font-size:14px;font-weight:900;margin:0}.timeline-note{margin:4px 0 16px;font-size:11px;color:#85858b}.forecast-summary{margin:0 0 16px;padding:10px 12px;border:1px solid #fbcfe8;border-radius:10px;background:#fdf2f8;color:#9d174d;font-size:11px;line-height:1.5}.event{position:relative;display:flex;gap:12px;min-height:75px}.event:not(:last-child):before{content:"";position:absolute;width:2px;left:13px;top:29px;bottom:0;background:#e4e4e7}.event.done:not(:last-child):before{background:#fe2c55}.dot{z-index:1;flex:none;width:28px;height:28px;border:2px solid #e4e4e7;background:#fff;border-radius:50%;display:grid;place-items:center;color:#a1a1aa;font-size:12px}.event.done .dot{background:#fe2c55;border-color:#fe2c55;color:#fff}.event.active .dot{border-color:#fe2c55;box-shadow:0 0 0 4px #fe2c551c;color:#fe2c55}.event-copy{padding:4px 0 17px}.event-copy strong{display:block;color:#b0b0b5;font-size:12px}.event.done .event-copy strong,.event.active .event-copy strong{color:#191919}.event-copy p{margin:4px 0 0;color:#85858b;font-size:10px;line-height:1.5}.event-copy time{display:block;margin-top:5px;color:#a1a1aa;font-size:10px}.event.forecast:not(:last-child):before{background:repeating-linear-gradient(to bottom,#d4d4d8 0 4px,transparent 4px 8px)}.event.forecast .dot{border-style:dashed;background:#fafafa}.event.forecast .event-copy strong{color:#737373}.event.forecast .event-copy p{color:#a1a1aa}.event.forecast-past .dot{border-color:#f9a8d4;background:#fdf2f8;color:#be185d}.event.forecast-past .event-copy strong{color:#374151}.event.forecast-current .dot{border-color:#fe2c55;box-shadow:0 0 0 4px #fe2c551c;color:#be185d}.event.forecast-current .event-copy strong{color:#9d174d}.help{text-align:center;color:#8a8a8a;margin:18px 0 0;font-size:10px}.help a{color:#fe2c55;font-weight:700;text-decoration:none}.skeleton{height:110px;border-radius:13px;background:linear-gradient(100deg,#f1f1f2 30%,#fafafa 50%,#f1f1f2 70%);background-size:200% 100%;animation:shine 1.3s infinite}@keyframes shine{to{background-position:-200% 0}}[hidden]{display:none!important}@media(max-width:520px){.wrap{padding:18px 13px 38px}.intro h1{font-size:22px}.search-card{padding:14px}.search-row{flex-direction:column}.search-row button{height:44px}.order-card,.timeline-card{padding:15px}.status{font-size:9px;padding:6px 8px}}
  </style>
</head>
<body>
  <header class="top"><span class="brand" aria-hidden="true">G</span> GOKOCO <span style="font-weight:500;opacity:.68;letter-spacing:0">· pedidos</span></header>
  <main class="wrap">
    <a class="back" href="/">← Voltar à loja</a>
    <section class="intro"><h1>Acompanhe seu pedido</h1><p>Veja as atualizações do seu pedido em um só lugar.</p></section>
    <section class="search-card"><form id="tracking-form"><label for="tracking-code">Código de rastreio</label><div class="search-row"><input id="tracking-code" name="codigo" maxlength="12" autocomplete="off" placeholder="Ex.: GK2A3B4C5D6E" required><button type="submit">Rastrear pedido</button></div><p class="message" id="message" aria-live="polite">O código está na mensagem de confirmação do pedido.</p></form></section>
    <div class="skeleton" id="loading" hidden></div>
    <section class="order-card" id="order" hidden></section>
    <section class="timeline-card" id="timeline" hidden></section>
    <p class="help">Precisa de ajuda? <a href="https://wa.me/5583991297085" target="_blank" rel="noopener noreferrer">Fale com nosso atendimento</a></p>
  </main>
  <script>
    (() => {
      const form=document.getElementById('tracking-form'),input=document.getElementById('tracking-code'),message=document.getElementById('message'),loading=document.getElementById('loading'),orderBox=document.getElementById('order'),timelineBox=document.getElementById('timeline');
      const labels={confirmed:'Pedido confirmado',preparing:'Preparando pedido',shipped:'Pedido enviado',out_for_delivery:'Saiu para entrega',delivered:'Pedido entregue'};
      const details={confirmed:'Pagamento aprovado e pedido confirmado.',preparing:'Seu pedido está sendo separado e preparado.',shipped:'Seu pedido foi despachado para entrega.',out_for_delivery:'Seu pedido está a caminho do endereço informado.',delivered:'A entrega foi concluída.'};
      const escapeHtml=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const date=(value)=>new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value));
      function show(data){
        const shipping=data.shipping||{},events=Array.isArray(shipping.events)?shipping.events:[],status=shipping.status||'confirmed',stageRank={confirmed:0,preparing:1,shipped:3,out_for_delivery:5,delivered:6},currentRank=stageRank[status]??0,origin=Date.parse(shipping.created_at||data.createdAt),now=Date.now();
        orderBox.innerHTML=`${data.buyerName?`<div class="buyer-greeting">Olá, ${escapeHtml(data.buyerName)} 👋</div>`:''}<div class="order-head"><div><div class="caption">Código de rastreio</div><div class="code">${escapeHtml(data.code)}</div></div><span class="status">${escapeHtml(labels[status]||'Pedido em atualização')}</span></div><div class="products">${(data.products?.length?data.products:[{name:'Escova Modeladora GOKOCO',quantity:1,image:null}]).map(p=>`<div class="product">${p.image?`<img class="product-image" src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" loading="lazy">`:'<span class="product-icon">📦</span>'}<span>${escapeHtml(p.name)}<small>Quantidade: ${Number(p.quantity)||1}</small></span></div>`).join('')}</div>${data.destination?.city?`<div class="destination">Destino: <strong>${escapeHtml(data.destination.city)}${data.destination.state?', '+escapeHtml(data.destination.state):''}</strong></div>`:''}`;
        const actual=[{status:'confirmed',at:shipping.created_at||data.createdAt,label:labels.confirmed,detail:details.confirmed},...events].filter((event,index,list)=>list.findIndex(item=>item.status===event.status)===index).sort((a,b)=>Date.parse(a.at)-Date.parse(b.at)).map(event=>({...event,kind:'actual'}));
        const actualStatuses=new Set(actual.map(event=>event.status));
        const HUBS={SP:'São Paulo, SP',RJ:'Rio de Janeiro, RJ',ES:'Vitória, ES',MG:'Belo Horizonte, MG',RS:'Porto Alegre, RS',SC:'Florianópolis, SC',PR:'Curitiba, PR',GO:'Goiânia, GO',DF:'Brasília, DF',MT:'Cuiabá, MT',MS:'Campo Grande, MS',TO:'Palmas, TO',BA:'Salvador, BA',SE:'Aracaju, SE',PE:'Recife, PE',PB:'João Pessoa, PB',AL:'Maceió, AL',RN:'Natal, RN',CE:'Fortaleza, CE',PI:'Teresina, PI',MA:'São Luís, MA',PA:'Belém, PA',AP:'Macapá, AP',AM:'Manaus, AM',RR:'Boa Vista, RR',AC:'Rio Branco, AC',RO:'Porto Velho, RO'};
        const ORIGIN_CITY='Guarulhos, SP',uf=String(data.destination?.state||'').toUpperCase(),hub=HUBS[uf]||'São Paulo, SP',clientCity=data.destination?.city?`${data.destination.city}${uf?', '+uf:''}`:'';
        const H=(h,m)=>(h*60+m)*60000;
        const planned=[
          {status:'preparing',rank:1,offset:H(0,20),label:'Previsão: Em separação',detail:`Estimativa de separação do produto no estoque — ${ORIGIN_CITY}.`},
          {status:'packed',rank:2,offset:H(0,40),label:'Previsão: Em embalagem',detail:'Estimativa de embalagem cuidadosa do pedido.'},
          {status:'shipped',rank:3,offset:H(1,30),label:'Previsão: Coletado pela transportadora',detail:`Estimativa de coleta e despacho — partindo de ${ORIGIN_CITY}.`},
          {status:'in_transit',rank:4,offset:H(4,0),label:'Previsão: Em trânsito',detail:hub!=='São Paulo, SP'?`Rota estimada — ${ORIGIN_CITY} → ${hub}.`:'Rota estimada — centro de triagem nacional.'},
          {status:'in_transit_2',rank:4.5,offset:H(24,0),label:'Previsão: Em trânsito para a unidade de destino',detail:clientCity?`Rota estimada — ${hub} → ${clientCity}.`:`Rota estimada para a unidade de distribuição de destino.`},
          {status:'out_for_delivery',rank:5,offset:H(48,0),label:'Previsão: Saiu para entrega',detail:clientCity?`Previsão de saída para entrega em ${clientCity}.`:'Previsão de saída para entrega no endereço informado.'},
          {status:'delivered',rank:6,offset:H(72,0),label:'Previsão: Entrega estimada',detail:'Prazo aproximado; a entrega só será confirmada após atualização real.'},
        ].filter(item=>item.rank>currentRank&&!actualStatuses.has(item.status)).map(item=>({...item,at:new Date(origin+item.offset).toISOString(),kind:'forecast'}));
        const elapsed=planned.filter(event=>Date.parse(event.at)<=now),projection=elapsed.at(-1)||planned[0],nextForecast=planned.find(event=>Date.parse(event.at)>now),deliveryForecast=[...actual,...planned].find(event=>event.status==='delivered');
        const projectionNote=status==='delivered'?'':`<p class="forecast-summary">${projection?`<strong>${elapsed.length?'Projeção estimada neste momento:':'Próxima etapa prevista:'}</strong> ${escapeHtml(projection.label.replace('Previsão: ',''))}.`:''}${nextForecast?` <strong>Próxima atualização prevista:</strong> ${escapeHtml(date(nextForecast.at))}.`:''}${deliveryForecast&&deliveryForecast.kind==='forecast'?` <strong>Entrega estimada:</strong> ${escapeHtml(date(deliveryForecast.at))}.`:''} Os horários são aproximados e não confirmados pela transportadora.</p>`;
        const timeline=[...actual,...planned].sort((a,b)=>Date.parse(a.at)-Date.parse(b.at));
        timelineBox.innerHTML=`<h2 class="timeline-title">Etapas do pedido</h2><p class="timeline-note">As etapas previstas avançam conforme o tempo desde a confirmação. Somente as atualizações registradas pela loja estão confirmadas.</p>${projectionNote}${timeline.map((event,index)=>{const done=event.kind==='actual'&&event.status!==status,active=event.kind==='actual'&&event.status===status,past=event.kind==='forecast'&&Date.parse(event.at)<=now,current=event===projection&&event.kind==='forecast';return `<div class="event ${done?'done':''} ${active?'active':''} ${event.kind==='forecast'?'forecast':''} ${past?'forecast-past':''} ${current?'forecast-current':''}"><span class="dot">${done?'✓':index+1}</span><div class="event-copy"><strong>${escapeHtml(event.label||labels[event.status]||'Atualização do pedido')}</strong><p>${escapeHtml(event.detail||details[event.status]||'')}</p><time>${event.kind==='forecast'?'Estimativa · ':''}${escapeHtml(date(event.at||data.createdAt))}</time></div></div>`}).join('')}`;
        orderBox.hidden=false;timelineBox.hidden=false;
      }      async function search(code,updateUrl){if(!code)return;input.value=code.toUpperCase();message.textContent='Buscando seu pedido…';message.className='message';loading.hidden=false;orderBox.hidden=true;timelineBox.hidden=true;form.querySelector('button').disabled=true;try{const response=await fetch('/api/public/order-tracking?code='+encodeURIComponent(code.toUpperCase()),{headers:{Accept:'application/json'},cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Não encontramos esse código. Confira e tente novamente.');show(data);message.textContent='Estas são as atualizações disponíveis para o seu pedido.';if(updateUrl)history.replaceState(null,'','/rastreio.html?codigo='+encodeURIComponent(data.code));}catch(error){message.textContent=error.message||'Não foi possível buscar o pedido. Tente novamente.';message.className='message error';}finally{loading.hidden=true;form.querySelector('button').disabled=false;}}
      form.addEventListener('submit',event=>{event.preventDefault();search(input.value.trim(),true);});const code=new URLSearchParams(location.search).get('codigo')||'';if(code)search(code,false);
    })();
  </script>
</body>
</html>
